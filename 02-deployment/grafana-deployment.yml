apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 3                # el ReplicaSet que crea el Deployment mantiene 3 Pods
  selector:
    matchLabels:
      app: grafana
  strategy:
    type: RollingUpdate      # las actualizaciones reemplazan los Pods de a poco
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.2.0
          ports:
            - containerPort: 3000
          readinessProbe:    # un Pod recibe tráfico solo cuando Grafana responde
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
