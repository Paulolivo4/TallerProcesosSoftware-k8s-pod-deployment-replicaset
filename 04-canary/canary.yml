# Canary: dos Deployments detrás del mismo Service.
# El reparto sale de la proporción de réplicas: 3 estables + 1 canary = 25 % al canary.
# La etiqueta "app: canarydemo" es única para no chocar con otros Pods del clúster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-stable
  labels:
    app: canarydemo
    track: stable
spec:
  replicas: 3
  selector:
    matchLabels:
      app: canarydemo
      track: stable
  template:
    metadata:
      labels:
        app: canarydemo   # etiqueta común: la que usa el Service
        track: stable
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=ESTABLE v1", "-listen=:5678"]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-canary
  labels:
    app: canarydemo
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canarydemo
      track: canary
  template:
    metadata:
      labels:
        app: canarydemo
        track: canary
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=CANARY v2", "-listen=:5678"]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector:
    app: canarydemo       # sin "track": recibe tráfico de estable y canary
  ports:
    - port: 80
      targetPort: 5678
