# Blue/Green: dos Deployments completos y un Service que apunta a uno de ellos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  labels:
    app: miapp
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miapp
      version: blue
  template:
    metadata:
      labels:
        app: miapp
        version: blue
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=BLUE v1", "-listen=:5678"]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  labels:
    app: miapp
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: miapp
      version: green
  template:
    metadata:
      labels:
        app: miapp
        version: green
    spec:
      containers:
        - name: web
          image: hashicorp/http-echo:1.0
          args: ["-text=GREEN v2", "-listen=:5678"]
          ports:
            - containerPort: 5678
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: miapp
spec:
  type: NodePort
  selector:
    app: miapp
    version: blue        # el cambio a green se hace modificando este selector
  ports:
    - port: 80
      targetPort: 5678
